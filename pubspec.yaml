name: agroledger
description: "A new Flutter project for AgroLedger."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_bloc: ^8.1.5
  bloc: ^8.1.3
  
  # Network
  dio: ^5.4.3+1
  
  # Service Locator
  get_it: ^7.6.7
  
  # Storage
  flutter_secure_storage: ^9.0.0
  
  # UI & Helpers
  google_fonts: ^6.2.1
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
