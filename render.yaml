services:
  # Бэкенд сервис
  - type: web
    name: agroledger-api
    env: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/v1/healthcheck
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agroledger-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440

databases:
  # База данных
  - name: agroledger-db
    plan: free
    databaseName: agroledger
    user: sapxan
